apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: devopsbatches.rohit.com

spec:
  group: rohit.com

  names:
    plural: devopsbatches
    singular: devopsbatch
    kind: DevOpsBatch
    shortNames:
      - dev
      - ops

  scope: Namespaced

  versions:
    - name: v1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: "This is the batch name"

                duration:
                  type: string
                  description: "This is the duration"

                mode:
                  type: string
                  description: "This is the mode"

                platform:
                  type: string
                  description: "This is the platform"
